  3456:
  - string: バットゥタ
  3457:
  - string: |-
      受け流し確率にボーナスを得る。
      さらに、受け流し発動時エンチャントルーンに依存し
      た反撃ダメージを与える。使用間隔:5分。
      能力値1で受け流し確率を4%アップ、反撃ダメージを
      エンチャントルーン１つにつき+4アップします。
  3458:
  - string: レイク
  3459:
  - string: |-
      ルーンを消費して、対象の属性耐性をダウンさせる。
      使用間隔:5分。
      能力値1で効果時間を3秒延長します。
  3460:
  - string: インスパイア
  3461:
  - string: |-
      ヴァレション、ヴァリエンスに魔法詠唱時間短縮の効
      果を得る。
      能力値1で魔法詠唱時間を10%短縮します。
  3462:
  - string: スライトソード
  3463:
  - string: |-
      ソードプレイ中、モクシャの効果を得る。
      能力値1でモクシャの効果の最大値を5アップします。
